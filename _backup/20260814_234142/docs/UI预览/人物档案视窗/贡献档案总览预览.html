<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8" />
<title>贡献档案总览预览 — 镜像 BuildOverview（2026-08-11）</title>
<meta name="viewport" content="width=900" />
<style>
  /* 严格镜像 OverviewSnapshot 绘制 + UITheme 令牌（旅居视角地主会计账本） */
  :root{
    --window:#11181f; --panel:#172129; --card:#25323b; --card2:#202b33;
    --border:#45535b; --border-soft:#2d3a42;
    --text:#e9eee9; --secondary:#999999; --dim:#71808a;
    --accent:#d09b61; --accent-soft:rgba(208,155,97,.15); --info:#95d0fc; --alive:#91e6b0;
    --pill-gold:#f2bd43; --pill-green:#6bcf8f; --pill-red:#dc7575; --pill-blue:#5c9ed4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0b0f13;color:var(--text);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:24px 12px 80px;}
  .window{width:840px;background:var(--window);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
  .header{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border-soft);}
  .logo{width:34px;height:34px;border:2px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;}
  .title{font-size:18px;font-weight:700;}
  .subtitle{font-size:11px;color:var(--secondary);margin-left:auto;}

  .content{padding:16px 18px;}
  .sectitle{display:flex;align-items:center;gap:8px;margin:6px 0 12px;}
  .sectitle::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:1px;}
  .sectitle span{font-size:15px;font-weight:600;}
  .sectitle .rule{flex:1;height:1px;background:var(--border);margin-left:6px;}

  /* 榨取总账 3 格 */
  .ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .cell{background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--accent);border-radius:4px;padding:10px;min-height:72px;}
  .cell .l{font-size:11px;color:var(--secondary);}
  .cell .v{font-size:22px;font-weight:700;margin-top:4px;}
  .cell .v.gold{color:var(--pill-gold);}
  .cell .v.green{color:var(--pill-green);}
  .cell .v.red{color:var(--pill-red);}

  /* 产出核销表 */
  .tbl{width:100%;border-collapse:collapse;margin-bottom:16px;}
  .tbl th,.tbl td{text-align:left;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--border-soft);}
  .tbl th{color:var(--dim);font-weight:600;}
  .tbl td.num{text-align:right;color:var(--secondary);}
  .tbl .neg{color:var(--pill-red);}
  .tbl .pos{color:var(--pill-green);}

  /* 健康残值结论 */
  .panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:4px;padding:12px 14px;margin-bottom:12px;}
  .panel h4{font-size:13px;margin-bottom:8px;display:flex;align-items:center;}
  .panel h4::before{content:"";width:3px;height:12px;background:var(--accent);margin-right:8px;}
  .verdict{font-size:13px;color:var(--text);line-height:1.6;}
  .verdict .ok{color:var(--alive);}
  .verdict .bad{color:var(--pill-red);}

  .footnote{font-size:11px;color:var(--dim);margin-top:16px;border-top:1px solid var(--border-soft);padding-top:10px;}
</style>

<div class="window">
  <div class="header">
    <div class="logo">献</div>
    <div class="title">贡献档案 · 总览</div>
    <div class="subtitle">旅居视角 · 地主会计账本</div>
  </div>
  <div class="content">
    <!-- 榨取总账 3 格 -->
    <div class="sectitle"><span>榨取总账</span><div class="rule"></div></div>
    <div class="ledger">
      <div class="cell"><div class="l">银净收益</div><div class="v gold">223</div></div>
      <div class="cell"><div class="l">食物消耗</div><div class="v green">-180</div></div>
      <div class="cell"><div class="l">工时投入</div><div class="v red">-45</div></div>
    </div>

    <!-- 产出核销 -->
    <div class="sectitle"><span>产出核销</span><div class="rule"></div></div>
    <table class="tbl">
      <thead><tr><th>类别</th><th style="text-align:right">产出</th><th style="text-align:right">消耗</th><th style="text-align:right">净额</th></tr></thead>
      <tbody>
        <tr><td>食物</td><td class="num">210</td><td class="num">180</td><td class="num pos">+30</td></tr>
        <tr><td>制成品</td><td class="num">64</td><td class="num">12</td><td class="num pos">+52</td></tr>
        <tr><td>武器</td><td class="num">18</td><td class="num">2</td><td class="num pos">+16</td></tr>
        <tr><td>药品</td><td class="num">9</td><td class="num">21</td><td class="num neg">-12</td></tr>
      </tbody>
    </table>

    <!-- 健康残值结论 -->
    <div class="sectitle"><span>健康残值</span><div class="rule"></div></div>
    <div class="panel">
      <h4>残值结论</h4>
      <div class="verdict">
        身体机能 <span class="ok">完好（98/100）</span>，慢性病 <span class="bad">哮喘</span>。
        综合判定：<span class="ok">可继续征用</span>。
      </div>
    </div>

    <div class="footnote">
      说明：本预览镜像 OverviewSnapshot（BuildOverview）的真实三块布局——榨取总账 3 格 / 产出核销表 / 健康残值结论。
      颜色全部取自 UITheme 令牌（--pill-gold/green/red 等），无散落十六进制，符合 UI 规范。
    </div>
  </div>
</div>
