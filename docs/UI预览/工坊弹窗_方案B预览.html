<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工坊弹窗方案B预览 · PersonalChronicle</title>
<style>
  :root{
    --bg:#0d1117; --card:#1c2230; --card-cur:#163024; --border:#2d3340;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --alive:#3fb950;
    --alive-soft:rgba(63,185,80,.18); --border-soft:#21262d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#05070a;display:flex;justify-content:center;padding:40px 16px;color:var(--text);}
  .win{width:520px;background:#11161f;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.5);}
  .title{padding:14px 18px 8px;font-size:17px;font-weight:650;}
  .hint{padding:0 18px 12px;font-size:12.5px;color:var(--muted);line-height:1.5;border-bottom:1px solid var(--border-soft);}
  .list{padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
  .row{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--border-soft);border-radius:10px;padding:8px 10px;position:relative;}
  .row.cur{background:var(--card-cur);border-color:rgba(63,185,80,.35);}
  .info{flex:1;min-width:0;padding-right:10px;}
  .name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .name .tag{font-size:11px;color:var(--alive);background:var(--alive-soft);border:1px solid rgba(63,185,80,.4);padding:1px 7px;border-radius:10px;font-weight:600;}
  .sub{font-size:12.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .divider{height:1px;background:var(--border-soft);margin-top:7px;}
  .icons{width:80px;display:flex;align-items:center;justify-content:flex-end;gap:4px;border-left:1px solid var(--border-soft);padding-left:8px;}
  .ico{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;transition:.15s;border:1px solid transparent;}
  .ico:hover{color:var(--accent);background:rgba(88,166,255,.12);border-color:rgba(88,166,255,.3);}
  .ico.disabled{color:#4a5560;cursor:not-allowed;}
  .ico.disabled:hover{background:transparent;border-color:transparent;color:#4a5560;}
  .ico.setcur{color:var(--alive);}
  .ico.setcur:hover{background:var(--alive-soft);border-color:rgba(63,185,80,.3);}
  .foot{padding:10px 18px;font-size:11px;color:#586069;border-top:1px solid var(--border-soft);text-align:right;}
</style>
</head>
<body>
  <div class="win">
    <div class="title">全部工作房间</div>
    <div class="hint">列出该殖民者曾使用过的工坊与当前地图其他制作台；可改名、定位或设为当前工作场所。</div>
    <div class="list">

      <div class="row">
        <div class="info">
          <div class="name">工作间</div>
          <div class="sub">锻造台 · 使用 12 次</div>
          <div class="divider"></div>
        </div>
        <div class="icons">
          <div class="ico" title="改名">✎</div>
          <div class="ico" title="定位">⊕</div>
          <div class="ico setcur" title="设为当前">✓</div>
        </div>
      </div>

      <div class="row cur">
        <div class="info">
          <div class="name">厨房 <span class="tag">✓ 当前</span></div>
          <div class="sub">炉灶（电力） · 使用 5 次</div>
          <div class="divider"></div>
        </div>
        <div class="icons">
          <div class="ico" title="改名">✎</div>
          <div class="ico" title="定位">⊕</div>
        </div>
      </div>

      <div class="row">
        <div class="info">
          <div class="name">厨房</div>
          <div class="sub">屠宰台 · 使用 2 次</div>
          <div class="divider"></div>
        </div>
        <div class="icons">
          <div class="ico" title="改名">✎</div>
          <div class="ico disabled" title="无坐标">⊕</div>
          <div class="ico setcur" title="设为当前">✓</div>
        </div>
      </div>

      <div class="row">
        <div class="info">
          <div class="name">户外/未知</div>
          <div class="sub">手工台 · 使用 1 次</div>
          <div class="divider"></div>
        </div>
        <div class="icons">
          <div class="ico" title="改名">✎</div>
          <div class="ico" title="定位">⊕</div>
          <div class="ico setcur" title="设为当前">✓</div>
        </div>
      </div>

    </div>
    <div class="foot">共 4 个工作房间 · 当前：厨房</div>
  </div>
</body>
</html>
