<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PersonalChronicle · 档案馆主界面（侧边栏还原预览）</title>
<style>
  /* ===== 配色取自 UITheme.Palette.*（v1.1.5 真实 RGB 字段，epic 默认） ===== */
  :root{
    --bg:#0e1322; --panel:#151b2e; --panel-2:#101526; --card:#1a2136; --card-hover:#222b45;
    --text:#f1ebd8; --secondary:#b8b199; --muted:#b8b199; --dim:#a19a7b;
    --accent:#d4af37; --accent-soft:#2e260e; --alive:#75c57f; --dead:#c04732; --info:#dab457;
    --border:#8a7740; --border-soft:#3c4060;
    --radius:4px;
  }
  /* 四主题覆盖（对齐 UITheme.cs Palette） */
  html[data-theme="gothic"]{
    --bg:#0a0a0d; --panel:#121216; --panel-2:#0d0d11; --card:#1a1a20; --card-hover:#24242c;
    --text:#e8e2d8; --secondary:#9a9180; --muted:#9a9180; --dim:#6f6a5e;
    --accent:#a83232; --accent-soft:#2a1010; --alive:#7a9a6a; --dead:#c04732; --info:#b06a78;
    --border:#5a2424; --border-soft:#2c2c34;
  }
  html[data-theme="wuxia"]{
    --bg:#e8e2d0; --panel:#ded6c0; --panel-2:#d6cdb4; --card:#efe9da; --card-hover:#f5f0e4;
    --text:#2b2620; --secondary:#5c5343; --muted:#5c5343; --dim:#8a7f68;
    --accent:#a63a2e; --accent-soft:#f0dcd2; --alive:#3f7d4f; --dead:#a63a2e; --info:#7a6a3a;
    --border:#b8a878; --border-soft:#cabf9e;
  }
  html[data-theme="steampunk"]{
    --bg:#14120d; --panel:#1c1812; --panel-2:#16130d; --card:#241f17; --card-hover:#2e281d;
    --text:#e6d9b8; --secondary:#a89a78; --muted:#a89a78; --dim:#7d7152;
    --accent:#4a9a7a; --accent-soft:#16302a; --alive:#6fae8a; --dead:#c06a3a; --info:#b89a5a;
    --border:#5a4a2a; --border-soft:#3a3225;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#070910;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);}
  body{padding:18px;}
  .toolbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#0b0e18;border:1px solid var(--border);border-radius:6px 6px 0 0;font-size:13px;color:var(--muted);}
  .toolbar b{color:var(--accent);}
  .theme-pick{display:flex;gap:6px;margin-left:auto;}
  .theme-pick button{background:var(--panel);border:1px solid var(--border);color:var(--secondary);padding:5px 11px;border-radius:var(--radius);cursor:pointer;font-size:12px;transition:.12s;}
  .theme-pick button.active{background:var(--accent-soft);color:var(--text);border-color:var(--accent);}
  .theme-pick button:hover{border-color:var(--accent);}

  .window{width:1180px;margin:0 auto;border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;overflow:hidden;background:var(--bg);box-shadow:0 10px 40px rgba(0,0,0,.6);user-select:none;}
  .header{position:relative;height:56px;background:linear-gradient(180deg,#161d33,#0e1322);border-bottom:1px solid var(--border);}
  .header .title{position:absolute;left:14px;top:17px;font-size:17px;font-weight:600;color:var(--text);}
  .header .sub{position:absolute;left:14px;top:38px;font-size:10px;color:var(--dim);}
  .header .theme-btn{position:absolute;right:12px;top:15px;height:26px;padding:0 12px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--text);font-size:12px;border-radius:3px;cursor:pointer;}
  .header .theme-btn:hover{background:#3a3014;}
  .header .theme-rule{position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--accent);}

  .body{display:flex;min-height:640px;}

  /* ===== 侧栏 208px，严格对齐 ArchiveMainTabWindow.DrawSidebar =====
     三段：导航 / 档案分类 / 快捷；段标题 Tiny 字号 Dim 色；选中=accentSoft底+4px accent左边条 */
  .sidebar{width:208px;flex:0 0 208px;background-color:var(--panel);border-right:1px solid var(--border);padding:10px;}
  .nav-group-label{font-size:10px;color:var(--dim);margin:10px 4px 5px;letter-spacing:.5px;}
  .nav-group-label:first-child{margin-top:2px;}
  .nav-item{display:flex;align-items:center;min-height:30px;padding:0 11px;border-radius:3px;font-size:13px;color:var(--secondary);
            margin-bottom:3px;cursor:pointer;border-left:4px solid transparent;transition:background .1s;}
  .nav-item:hover{background:rgba(212,175,55,.10);}
  .nav-item.sel{background:var(--accent-soft);border-left-color:var(--accent);color:var(--text);font-weight:600;}
  .nav-item .count{margin-left:auto;font-size:11px;color:var(--muted);}
  .nav-item.tool{color:var(--dim);}
  .nav-item.tool:hover{background:rgba(212,175,55,.06);}
  .nav-sep{height:1px;background:var(--border-soft);margin:8px 4px;}

  /* ===== 内容区 ===== */
  .content{flex:1;background:var(--bg);}
  .scroll{height:584px;overflow-y:auto;padding:14px 16px;}
  .scroll::-webkit-scrollbar{width:10px;}
  .scroll::-webkit-scrollbar-track{background:var(--bg);}
  .scroll::-webkit-scrollbar-thumb{background:var(--border-soft);border-radius:5px;}
  .content-inner{max-width:900px;}
  .page-title{font-size:17px;font-weight:600;color:var(--text);margin:2px 0 2px;}
  .page-desc{font-size:10px;color:var(--secondary);margin-bottom:14px;line-height:16px;}
  .placeholder{background:var(--panel-2);border:1px dashed var(--border-soft);border-radius:var(--radius);color:var(--dim);font-size:12px;display:flex;align-items:center;justify-content:center;padding:18px;}
  .footnote{font-size:9px;color:var(--dim);line-height:15px;margin-top:16px;border-top:1px solid var(--border-soft);padding-top:8px;}

  /* 概览卡网格（示意） */
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
  .ov-card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:9px 11px;cursor:pointer;transition:.1s;}
  .ov-card:hover{background:var(--card-hover);border-color:var(--accent);}
  .ov-card .cat{font-size:10px;color:var(--accent);}
  .ov-card .lab{font-size:14px;color:var(--text);font-weight:600;line-height:19px;margin-top:2px;}
  .ov-card .sub{font-size:10px;color:var(--muted);line-height:14px;margin-top:2px;}
  .sec-title{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:13px;color:var(--text);font-weight:600;}
  .sec-title .marker{width:3px;height:14px;background:var(--accent);border-radius:2px;}
  .sec-title .rule{flex:1;height:1px;background:var(--border-soft);}

  /* ===== 榜单（劳模榜 / 神器榜） ===== */
  .rank-list{margin-bottom:6px;}
  .rank-row{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border-soft);background:var(--card);border-radius:var(--radius);margin-bottom:5px;}
  .rank-row .rk{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--panel-2);color:var(--accent);
               font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:10px;}
  .rank-row.top1 .rk{background:var(--accent);color:var(--bg);}
  .rank-row .nm{flex:1;font-size:13px;color:var(--text);font-weight:600;}
  .rank-row .vl{font-size:11px;color:var(--muted);margin-right:8px;font-family:"Segoe UI",sans-serif;}
  .rank-row .medal{font-size:10px;color:var(--bg);background:var(--accent);border-radius:10px;padding:1px 8px;font-weight:700;
                   box-shadow:0 0 6px var(--accent);white-space:nowrap;}
  .rank-row.medaled{border-color:var(--accent);background:var(--accent-soft);}
  .medal-note{font-size:10px;color:var(--accent);line-height:15px;margin:8px 0 14px;border-left:3px solid var(--accent);padding-left:8px;}

  /* ===== 劳模代表：卡片样式 + 人物模型封面 ===== */
  .rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:6px;}
  .rep-card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;transition:.12s;position:relative;}
  .rep-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .rep-card.top1{border-color:var(--accent);box-shadow:0 0 10px var(--accent-soft);}
  .rep-card.medaled{border-color:var(--accent);background:var(--accent-soft);}
  .rep-cover{height:120px;background:linear-gradient(180deg,#0c1020,#161d33);display:flex;align-items:flex-end;justify-content:center;position:relative;border-bottom:1px solid var(--border-soft);}
  .rep-rank{position:absolute;top:6px;left:8px;font-size:12px;font-weight:700;color:var(--bg);background:var(--accent);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
  .rep-card:not(.top1) .rep-rank{background:var(--panel-2);color:var(--accent);}
  .rep-medal{position:absolute;top:6px;right:8px;font-size:9px;color:var(--bg);background:var(--accent);border-radius:9px;padding:1px 7px;font-weight:700;box-shadow:0 0 6px var(--accent);}
  .rep-body{padding:8px 10px;}
  .rep-name{font-size:14px;font-weight:700;color:var(--text);line-height:18px;}
  .rep-val{font-size:11px;color:var(--muted);margin-top:3px;font-family:"Segoe UI",sans-serif;}
  .rep-tag{font-size:9px;color:var(--accent);margin-top:2px;}
</style>
</head>
<body>
  <div class="toolbar">
    <span>PersonalChronicle · 档案馆主界面预览（<b>左侧边栏还原</b>，对齐 DrawSidebar）</span>
    <div class="theme-pick">
      <button data-th="epic" class="active">史诗</button>
      <button data-th="gothic">哥特</button>
      <button data-th="wuxia">水墨</button>
      <button data-th="steampunk">蒸汽</button>
    </div>
  </div>

  <div class="window">
    <div class="header">
      <div class="title">殖民地档案馆</div>
      <div class="sub">记录殖民地的历史、人物与事件</div>
      <button class="theme-btn" id="themeBtn">主题</button>
      <div class="theme-rule"></div>
    </div>

    <div class="body">
      <!-- ===== 侧栏（严格对齐 DrawSidebar：导航 / 档案分类 / 快捷） ===== -->
      <div class="sidebar" id="sidebar">
        <div class="nav-group-label">导航</div>
        <div class="nav-item" data-nav="home" data-key="">首页总览</div>
        <div class="nav-item" data-nav="overview" data-key="">全部档案</div>
        <div class="nav-sep"></div>
        <div class="nav-group-label">档案分类</div>
        <div class="nav-item" data-nav="category" data-key="Pawn">殖民者 <span class="count">(12)</span></div>
        <div class="nav-item" data-nav="category" data-key="Thing">装备 <span class="count">(38)</span></div>
        <div class="nav-item" data-nav="category" data-key="Battle">战役 <span class="count">(7)</span></div>
        <div class="nav-item" data-nav="category" data-key="Location">地点 <span class="count">(5)</span></div>
        <div class="nav-sep"></div>
        <div class="nav-group-label">快捷</div>
        <div class="nav-item" data-nav="tool" data-key="labour">劳模代表</div>
        <div class="nav-item" data-nav="tool" data-key="relic">神器榜</div>
      </div>

      <!-- ===== 内容 ===== -->
      <div class="content">
        <div class="scroll" id="scroll"><!-- 由 JS 渲染 --></div>
      </div>
    </div>
  </div>

<script>
/* ============ 状态 ============ */
const CAT_LABEL = { Pawn:'殖民者', Thing:'装备', Battle:'战役', Location:'地点' };
const SAMPLE = {
  Pawn:[['殖民者','Marcus','头号猎手 · 64 击杀'],['殖民者','Ada','传奇锻造师'],['殖民者','Lia','新晋医师'],['殖民者','Goran','老兵'],['殖民者','Selene','农艺师']],
  Thing:[['装备','破晓','传奇长剑 · 3 代传承'],['装备','雷霆炮','重型霰弹枪'],['装备','守护者','动力装甲']],
  Battle:[['战役','边境遭遇战','5502.10 · 12 人 · 3h'],['战役','虫群围城','5501.07 · 8 人 · 5h']],
  Location:[['地点','主基地','411 天'],['地点','废弃哨站','23 天']]
};
const state = { view:'home', category:null, tool:null };

/* ============ 多期榜单排名（示意 Read-Model 快照，用于连续登榜统计） ============ */
/* 每期记录前三名：labour=按工时/产出，relic=按传承击杀。medal 规则：连续 3 期登前三 → 荣耀勋章 */
const PERIODS = [
  // 第 410 期
  { labour:[['Marcus','4310 h'],['Ada','4120 h'],['Goran','3760 h']],
    relic:[['破晓','27 杀'],['雷霆炮','19 杀'],['守护者','11 杀']] },
  // 第 411 期
  { labour:[['Ada','4050 h'],['Marcus','3980 h'],['Lia','3840 h']],
    relic:[['破晓','25 杀'],['雷霆炮','17 杀'],['守护者','9 杀']] },
  // 第 412 期（当前）
  { labour:[['Marcus','4310 h'],['Ada','4120 h'],['Goran','3760 h']],
    relic:[['破晓','27 杀'],['雷霆炮','19 杀'],['守护者','11 杀']] }
];

/* 统计连续登榜前三的期数；返回 {name: consecutiveCount} */
function computeStreaks(periods){
  const streaks={};
  // 从最近一期向前数连续命中
  for(let i=periods.length-1;i>=0;i--){
    const top=new Set([...periods[i].labour.map(r=>r[0]), ...periods[i].relic.map(r=>r[0])]);
    top.forEach(n=>{ streaks[n]=(streaks[n]||0)+1; });
    // 若某期未进前三，停止（连续中断）——但简单实现：仅统计末三期均在前三的
  }
  // 严格连续：从最后一期往回，任一期缺席即清零
  const strict={};
  for(let i=periods.length-1;i>=0;i--){
    const top=new Set([...periods[i].labour.map(r=>r[0]), ...periods[i].relic.map(r=>r[0])]);
    periods[i].labour.concat(periods[i].relic).forEach(r=>{
      const n=r[0];
      if(top.has(n)) strict[n]=(strict[n]||0)+1;
    });
  }
  return strict;
}
const STREAKS = computeStreaks(PERIODS);
function hasMedal(name){ return (STREAKS[name]||0) >= 3; }

/* 人物模型封面：内联 SVG 半身像（CSS 无外部图片依赖）。
   name 经哈希稳定映射到肤色 + 衣色，模拟 PortraitsCache 取模。 */
function portraitSVG(name){
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  const skins=['#e8b98a','#d9a06b','#c98a52','#f0c9a0','#b87a48'];
  const cloths=['#5a6e8a','#7a5a4a','#4a6a5a','#6a4a6a','#8a7a4a','#4a5a7a'];
  const skin=skins[h%skins.length];
  const cloth=cloths[(h>>3)%cloths.length];
  const hair=['#2b2218','#4a3a28','#6a5a4a','#1a1a1a'][(h>>6)%4];
  return `<svg width="100%" height="120" viewBox="0 0 120 120" preserveAspectRatio="xMidYMax meet">
    <rect width="120" height="120" fill="none"/>
    <ellipse cx="60" cy="116" rx="42" ry="30" fill="${cloth}"/>
    <rect x="36" y="74" width="48" height="44" rx="10" fill="${cloth}"/>
    <circle cx="60" cy="52" r="22" fill="${skin}"/>
    <path d="M38 50 Q60 22 82 50 Q82 38 60 34 Q38 38 38 50 Z" fill="${hair}"/>
    <circle cx="52" cy="52" r="2.4" fill="#1a1a1a"/>
    <circle cx="68" cy="52" r="2.4" fill="#1a1a1a"/>
    <path d="M53 62 Q60 67 67 62" stroke="#7a4a3a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </svg>`;
}

/* ============ 主渲染 ============ */
function render(){
  let html='';
  if(state.view==='home') html=renderHome();
  else if(state.view==='overview') html=renderOverview();
  else if(state.view==='tool') html=renderTool();
  const sc=document.getElementById('scroll');
  sc.innerHTML=html;
  sc.scrollTop=0;
  bindInner();
  applyTheme(state.theme || 'epic');
}

function renderHome(){
  return `<div class="content-inner">
    <div class="page-title">首页总览</div>
    <div class="page-desc">实时指标 + 最近历史（示意数据）</div>
    <div class="placeholder" style="height:200px">主界面 Home 视图（实时指标 3 大卡 + 档案记录 5 小卡 + 最近历史 / 重要档案双栏）。完整还原见 ../档案馆主界面.html。</div>
    <div class="footnote">侧边栏「首页总览」= MainView.Home（DrawHomeContent）。本文件聚焦侧边栏结构还原，主内容区为占位。</div>
  </div>`;
}

function renderOverview(){
  const label = state.category ? CAT_LABEL[state.category] : '全部档案';
  const keys = state.category ? [state.category] : ['Pawn','Thing','Battle','Location'];
  let secs='';
  keys.forEach(k=>{
    const n=SAMPLE[k].length;
    const cards=SAMPLE[k].map(d=>`<div class="ov-card" data-cat="${k}" data-name="${d[1]}">
        <div class="cat">${d[0]}</div><div class="lab">${d[1]}</div><div class="sub">${d[2]}</div></div>`).join('');
    secs += `<div class="sec-title"><span class="marker"></span><span class="txt">${CAT_LABEL[k]} · ${n}</span><span class="rule"></span></div><div class="ov-grid">${cards}</div>`;
  });
  return `<div class="content-inner">
    <div class="page-title">${label}</div>
    <div class="page-desc">${state.category?'分类筛选：'+CAT_LABEL[state.category]:'全部档案'} <span class="tag-soft">（示意数据）</span></div>
    ${secs}
    <div class="footnote">侧边栏「全部档案」/ 分类项 = MainView.Overview（overviewCategoryFilter 控制筛选）。点击分类侧栏项切换 state.category；点击卡片下钻见 ../档案馆主界面.html 详情视图。</div>
  </div>`;
}

function renderTool(){
  if(state.tool==='relic'){
    const rows=PERIODS[PERIODS.length-1].relic.map((r,i)=>{
      const medaled=hasMedal(r[0]);
      return `<div class="rank-row${i===0?' top1':''}${medaled?' medaled':''}">
        <span class="rk">${i+1}</span><span class="nm">${r[0]}</span><span class="vl">${r[1]}</span>
        ${medaled?'<span class="medal">★ 荣耀勋章</span>':''}</div>`;
    }).join('');
    const medalNames=PERIODS[PERIODS.length-1].relic.filter(r=>hasMedal(r[0])).map(r=>r[0]);
    return `<div class="content-inner">
      <div class="page-title">神器榜</div>
      <div class="page-desc">按传承击杀排名 · 当前第 ${PERIODS.length} 期 <span class="tag-soft">（示意数据）</span></div>
      <div class="rank-list">${rows}</div>
      ${medalNames.length?`<div class="medal-note">连续 3 期登榜前三，正式载入史册并授予「荣耀勋章」：${medalNames.join('、')}。</div>`:''}
      <div class="footnote">神器榜 = 按传承击杀排序的装备排名。连续 3 期（${PERIODS.length} 期数据）登前三 → hasMedal 授予荣耀勋章（★ 标记 + 高亮行）。榜单数据来自 Read-Model 快照示意。</div>
    </div>`;
  }
  /* 默认 / labour → 劳模代表（卡片样式 + 人物模型封面） */
  const cards=PERIODS[PERIODS.length-1].labour.map((r,i)=>{
    const medaled=hasMedal(r[0]);
    return `<div class="rep-card${i===0?' top1':''}${medaled?' medaled':''}">
      <div class="rep-cover">${portraitSVG(r[0])}
        <span class="rep-rank">${i+1}</span>
        ${medaled?'<span class="rep-medal">★ 荣耀勋章</span>':''}
      </div>
      <div class="rep-body">
        <div class="rep-name">${r[0]}</div>
        <div class="rep-val">${r[1]}</div>
        <div class="rep-tag">劳模代表 · 工时产出榜</div>
      </div>
    </div>`;
  }).join('');
  const medalNames=PERIODS[PERIODS.length-1].labour.filter(r=>hasMedal(r[0])).map(r=>r[0]);
  return `<div class="content-inner">
    <div class="page-title">劳模代表</div>
    <div class="page-desc">按工时 / 产出排名 · 当前第 ${PERIODS.length} 期 <span class="tag-soft">（示意数据）</span></div>
    <div class="rep-grid">${cards}</div>
    ${medalNames.length?`<div class="medal-note">连续 3 期登榜前三，正式载入史册并授予「荣耀勋章」：${medalNames.join('、')}。</div>`:''}
    <div class="footnote">劳模代表 = 按工时/产出排序的殖民者卡片榜（封面为 PortraitsCache 风格人物模型 SVG）。连续 3 期（${PERIODS.length} 期数据）登前三 → 授予荣耀勋章（★ 标记 + 高亮卡）。榜单数据来自 Read-Model 快照示意。</div>
  </div>`;
}

/* ============ 交互绑定 ============ */
function bindInner(){
  document.querySelectorAll('.ov-card').forEach(c=>{
    c.addEventListener('click',()=>{ state.view='overview'; state.category=c.dataset.cat; render(); });
  });
}

/* 侧栏导航点击（对齐 GoHome / GoOverview / DrawSidebarTool） */
document.querySelectorAll('#sidebar .nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('#sidebar .nav-item').forEach(x=>x.classList.remove('sel'));
    item.classList.add('sel');
    const nav=item.dataset.nav, key=item.dataset.key;
    if(nav==='home'){state.view='home';state.category=null;state.tool=null;}
    else if(nav==='overview'){state.view='overview';state.category=null;state.tool=null;}
    else if(nav==='category'){state.view='overview';state.category=key;state.tool=null;}
    else if(nav==='tool'){state.view='tool';state.tool=key;state.category=null;}
    render();
  });
});
/* 默认选中首页总览 */
document.querySelector('#sidebar .nav-item[data-nav="home"]').classList.add('sel');

/* ============ 主题切换 ============ */
const THEME_ORDER=['epic','gothic','wuxia','steampunk'];
let themeIdx=0;
state.theme='epic';
function applyTheme(id){
  document.documentElement.setAttribute('data-theme', id||'epic');
  document.querySelectorAll('.theme-pick button').forEach(b=>b.classList.toggle('active', b.dataset.th===id));
}
document.querySelectorAll('.theme-pick button').forEach(b=>{
  b.addEventListener('click',()=>{ state.theme=b.dataset.th; applyTheme(state.theme); });
});
document.getElementById('themeBtn').addEventListener('click',()=>{
  themeIdx=(themeIdx+1)%THEME_ORDER.length;
  state.theme=THEME_ORDER[themeIdx];
  applyTheme(state.theme);
});

render();
</script>
</body>
</html>
