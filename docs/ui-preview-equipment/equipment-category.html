<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Chronicle · 装备分类子容器调试</title>
  <style>
    :root {
      --bg: #1a1a1a; --panel: #242424; --panel-2: #2c2c2c; --panel-3: #333;
      --border: #4a4a4a; --border-soft: #3a3a3a; --text: #e8e8e8; --muted: #b8b8b8;
      --dim: #787878; --accent: #5c9ed4; --accent-soft: rgba(92,158,212,.18);
      --alive: #6bcf8f; --dead: #f06161; --tag: #e69e3b; --info: #5fb0d0;
      --select: rgba(180,160,90,.28); --hover: rgba(255,255,255,.06); --line: #4a4a4a;
      --sidebar-w: 220px; --font: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0e0e0e; color: var(--text); font-family: var(--font); font-size: 13px; }
    body { display: flex; flex-direction: column; align-items: center; padding: 20px 16px 48px; gap: 14px; }

    .toolbar { width: min(920px, 100%); background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 10px 14px; }
    .toolbar h1 { margin: 0; font-size: 14px; font-weight: 600; color: #ddd; }
    .toolbar .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
    .toolbar-actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .toolbar button { background: #2a2a2a; color: var(--text); border: 1px solid #444; border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12px; }
    .toolbar button:hover { background: #363636; }
    .toolbar button.active { background: var(--accent-soft); border-color: var(--accent); color: #cfe6f7; }
    .badge-v { background: #3a4a20; color: #c6e08a; font-size: 11px; padding: 1px 6px; border-radius: 3px; }

    .window {
      width: min(920px, 100%); max-height: calc(100vh - 160px);
      background: var(--bg); border: 1px solid #555; box-shadow: 0 12px 40px rgba(0,0,0,.55);
      display: grid; grid-template-rows: 44px 1fr; overflow: hidden;
    }
    .window.annotate [data-component] { outline: 1px dashed rgba(230,158,59,.45); position: relative; }
    .window.annotate [data-component]::after {
      content: attr(data-component); position: absolute; top: 2px; right: 2px; z-index: 5;
      font-size: 9px; padding: 1px 4px; background: rgba(230,158,59,.9); color: #111;
      border-radius: 2px; pointer-events: none; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header { display: flex; align-items: center; padding: 0 12px; gap: 16px; border-bottom: 1px solid var(--border); background: #1f1f1f; }
    .header .title { font-size: 16px; font-weight: 500; min-width: 120px; }
    .header .breadcrumb { color: var(--muted); font-size: 12px; flex: 1; }
    .header .ver { color: var(--dim); font-size: 11px; }

    .body { display: grid; grid-template-columns: var(--sidebar-w) 1fr; gap: 10px; padding: 10px; min-height: 0; height: 100%; }
    .sidebar, .content { background: var(--panel); border: 1px solid var(--border-soft); min-height: 0; overflow: auto; }
    .sidebar { padding: 8px; }
    .side-label { color: var(--muted); font-size: 11px; padding: 4px 6px 6px; }
    .side-item { display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 8px; margin-bottom: 3px; border: none; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; border-radius: 2px; width: 100%; }
    .side-item:hover { background: var(--hover); }
    .side-item.active { background: var(--select); }
    .side-spacer { height: 8px; }
    .content { padding: 10px 12px; }

    .page-title { font-size: 18px; margin: 0 0 4px; font-weight: 500; }
    .page-desc { color: var(--muted); font-size: 11px; margin: 0 0 14px; }
    .section-title { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; font-size: 13px; }
    .section-title:first-child { margin-top: 0; }
    .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* 装备总览子容器（DrawOverviewContent · Thing 区块） */
    .ov-section { margin-bottom: 18px; }
    .ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 190px)); gap: 12px; }
    .obj-card { background: var(--panel-2); border: 1px solid var(--border-soft); min-height: 70px; padding: 6px 8px; cursor: pointer; }
    .obj-card:hover { background: var(--panel-3); }
    .obj-card .cat { font-size: 11px; color: var(--muted); }
    .obj-card .name { font-size: 13px; margin: 4px 0; }
    .obj-card .sub { font-size: 11px; color: var(--muted); }
    .empty { color: var(--dim); font-size: 12px; padding: 8px 2px; }
    .footnote { color: var(--muted); font-size: 11px; margin: 8px 2px 0; }
    .blurb { background: var(--panel-2); border: 1px solid var(--border-soft); border-left: 3px solid var(--tag); padding: 8px 10px; margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: #ddd; }
    .blurb .k { color: var(--muted); font-size: 11px; margin-bottom: 3px; }

    /* 装备详情子容器（DrawDetailContent · weapon） */
    .obj-header { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .obj-header .name { font-size: 22px; margin-bottom: 9px; }
    .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
    .pill.blue { color: var(--info); border-color: var(--info); background: rgba(95,176,208,.12); }
    .meta-line { color: var(--muted); font-size: 12px; margin-top: 8px; }

    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab { background: #2a2a2a; color: var(--muted); border: 1px solid #444; border-radius: 4px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 12px; }
    .tab:hover { background: #363636; }
    .tab.active { background: var(--accent-soft); border-color: var(--accent); color: #cfe6f7; }

    .stats.kpi4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat-cell { background: var(--panel-2); border: 1px solid var(--border-soft); min-height: 64px; padding: 6px 8px; }
    .stat-cell .label { font-size: 11px; }
    .stat-cell .value { font-size: 18px; margin-top: 4px; font-weight: 500; }

    .detail-row { display: flex; gap: 10px; padding: 4px 2px; border-bottom: 1px solid var(--border-soft); }
    .detail-row .k { color: var(--muted); width: 90px; flex: 0 0 90px; font-size: 12px; }
    .detail-row .v { font-size: 12px; }

    /* 继承链 Custody 表 */
    table.stat { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
    table.stat th, table.stat td { border: 1px solid var(--border-soft); padding: 5px 8px; text-align: left; }
    table.stat th { background: var(--panel-2); color: var(--muted); font-weight: 500; }
    table.stat tr.clickable { cursor: pointer; }
    table.stat tr.clickable:hover { background: var(--panel-3); }
    .chip.first { border: 1px solid var(--accent); border-radius: 10px; padding: 1px 6px; margin: 0 4px 0 0; color: var(--accent); background: var(--accent-soft); font-size: 10px; }
    .chip.loan { border: 1px solid var(--dim); border-radius: 10px; padding: 1px 6px; margin: 0 4px 0 0; color: var(--dim); background: transparent; font-size: 10px; }

    /* 传承称号 + 评价 */
    .legacy-title { display: inline-block; font-size: 13px; color: var(--tag); border: 1px solid var(--tag); border-radius: 3px; padding: 2px 10px; margin: 4px 0 0; letter-spacing: .04em; }
    .verdict { background: var(--panel-2); border: 1px solid var(--border-soft); border-left: 3px solid var(--accent); padding: 8px 10px; margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: #e0e0e0; }

    /* 主表：当前持有行高亮 + 展开/收起 */
    table.stat tr.current { background: rgba(107,207,143,.08); }
    table.stat tr.current:hover { background: var(--panel-3); }
    .expand-row { text-align: center; padding: 6px; }
    .expand-btn { background: #2a2a2a; color: var(--accent); border: 1px solid var(--border); border-radius: 3px; padding: 3px 12px; cursor: pointer; font: inherit; font-size: 12px; }
    .expand-btn:hover { background: #363636; border-color: var(--accent); }

    @media (max-width: 640px) {
      .body { grid-template-columns: 1fr; }
      .sidebar { max-height: 220px; }
      .stats.kpi4 { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>Personal Chronicle · 装备分类子容器调试</h1>
      <div class="meta">提取自 equipment-provenance.html · 装备总览（Thing 区块）+ 装备详情（传承 Legacy 子容器）· 对应 DrawOverviewContent / DrawDetailContent</div>
    </div>
    <span class="badge-v">v4.6.5 装备分类</span>
    <div class="toolbar-actions">
      <button id="btn-zh" class="active">中文</button>
      <button id="btn-en">English</button>
    </div>
  </div>

  <div class="window annotate">
    <div class="header">
      <div class="title">殖民地档案馆</div>
      <div class="breadcrumb" id="breadcrumb">装备 · 总览</div>
      <div class="ver">UI Spec v4.3</div>
    </div>

    <div class="body">
      <aside class="sidebar" data-component="DrawSidebar">
        <div class="side-label">导航</div>
        <button class="side-item" id="nav-home">首页总览</button>
        <button class="side-item" id="nav-overview">全部档案</button>
        <div class="side-spacer"></div>
        <div class="side-label">档案分类</div>
        <button class="side-item" data-filter="Pawn">人物 <span>(4)</span></button>
        <!-- 装备（原「物品」）为当前调试分类 -->
        <button class="side-item active" data-filter="Thing">装备 <span>(3)</span></button>
        <button class="side-item" data-filter="Battle">战役 <span>(2)</span></button>
        <button class="side-item" data-filter="Location">地点 <span>(1)</span></button>
        <div class="side-spacer"></div>
        <div class="side-label">快捷</div>
        <button class="side-item disabled">收藏</button>
        <button class="side-item disabled">里程碑</button>
        <button class="side-item disabled">搜索</button>
      </aside>

      <main class="content" data-component="DrawContent">
        <!-- 子容器 1：装备总览（DrawOverviewContent · Thing 区块） -->
        <section id="view-overview" data-component="DrawOverviewContent">
          <h2 class="page-title">装备档案</h2>
          <p class="page-desc">所有已建档装备（武器 + 护甲，建筑/原材料已排除）· 点击进入传承详情</p>
          <div class="ov-section" data-cat="Thing">
            <div class="section-title"><span data-cat="catThing">装备</span> · <span id="thing-count">3</span></div>
            <div class="ov-grid" id="thing-grid"></div>
          </div>
        </section>

        <!-- 子容器 2：装备详情（DrawDetailContent · weapon，传承 Legacy） -->
        <section id="view-weapon" data-component="DrawDetailContent" style="display:none">
          <div class="obj-header" data-component="DrawObjectHeader">
            <h2 class="name" id="weapon-name">—</h2>
            <span class="pill blue" data-cat="catThing">装备</span>
            <div class="meta-line" id="weapon-meta"></div>
          </div>
          <div class="tabs" id="weapon-tabs" data-component="DrawTabBar"></div>
          <div id="weapon-panel" data-component="DrawDetailPanel"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const I18N = {
      zh: {
        catThing: "装备",
        tab: { Legacy: "传承" },
        kpiEvents: "事件数", kpiKills: "击杀", holders: "持有者数", crafter: "制造者",
        type: "类型", craftedAt: "制造于", holder: "当前持有", keyEvents: "关键事件",
        // 传承（原「流转」）区块
        legacy: "传承", legacySummary: "传承概要", legacyChain: "历届持有者", legacyNote: "传承纪要",
        legacyVerdict: "传承评价", legacyTitle: "传承称号",
        createdBy: "创建者", createdAt: "创建时间", legacyGen: "传承代数", currentHolder: "当前持有",
        firstHolder: "第一任", totalKillsN: "全链击杀",
        holder: "持有者", from: "起于", to: "止于", duration: "时长", kills: "击杀数",
        remark: "备注", gen: "第", th: "任", noLegacy: "— 此装备尚无传承记录 —",
        expandAll: "共 {0} 任 · 展开全部", collapse: "收起",
        loan: "借用", legacyGenNote: "传承代数（仅计所有权变更）",
        crafterUnknown: "未知",
      },
      en: {
        catThing: "Equipment",
        tab: { Legacy: "Legacy" },
        kpiEvents: "Events", kpiKills: "Kills", holders: "Holders", crafter: "Crafter",
        type: "Type", craftedAt: "Crafted", holder: "Current holder", keyEvents: "Key events",
        legacy: "Legacy", legacySummary: "Legacy Summary", legacyChain: "Holders Through Ages", legacyNote: "Legacy Note",
        legacyVerdict: "Verdict", legacyTitle: "Epithet",
        createdBy: "Created by", createdAt: "Created at", legacyGen: "Generations", currentHolder: "Current holder",
        firstHolder: "First", totalKillsN: "Total kills",
        holder: "Holder", from: "From", to: "To", duration: "Duration", kills: "Kills",
        remark: "Note", gen: "Gen ", th: "", noLegacy: "— No legacy record —",
        expandAll: "{0} holders · Expand all", collapse: "Collapse",
        loan: "Loan", legacyGenNote: "Generations (ownership transfers only)",
        crafterUnknown: "Unknown",
      }
    };

    // 装备数据（来自原沙盒 weapons；thing-solar 为建筑，仅作对照，C# 侧已排除出装备）
    const weapons = {
      "thing-rifle": {
        name: { zh: "充电步枪", en: "Charge rifle" }, def: "Gun_ChargeRifle",
        crafter: { zh: "艾拉", en: "Ella" }, crafterId: "pawn-ela",
        craftedAt: { zh: "5503 年 夏 41 日", en: "5503 Summer 41" },
        kills: 1, holderCount: 2, currentHolder: { zh: "艾拉", en: "Ella" }, currentHolderId: "pawn-ela",
        legacyTitle: { zh: "边陲之牙", en: "Fang of the Frontier" },
        legacyNote: { zh: "由艾拉亲手锻造，仅历一任主人，期间曾暂借汤姆，于边境冲突中初露锋芒。", en: "Forged by Ella, a single owner; once lent to Tom, first blooded in a border skirmish." },
        custody: [
          { gen: 1, kind: "own", who: { zh: "艾拉", en: "Ella" }, id: "pawn-ela", from: { zh: "5503 夏 41", en: "5503 Su41" }, to: { zh: "今", en: "now" }, dur: { zh: "主持有", en: "Primary" }, kills: 1, isFirst: true, createdBy: { zh: "艾拉", en: "Ella" }, createdAt: { zh: "5503 年 夏 41 日", en: "5503 Summer 41" }, remark: { zh: "出厂即持有，参与边境冲突初杀。", en: "Owner since forge; first kill at border." } },
          { gen: null, kind: "loan", who: { zh: "汤姆", en: "Tom" }, id: "pawn-tom", from: { zh: "5503 夏 42", en: "5503 Su42" }, to: { zh: "5503 夏 45", en: "5503 Su45" }, dur: { zh: "3 日", en: "3 days" }, kills: 0, isFirst: false, createdBy: { zh: "艾拉", en: "Ella" }, createdAt: { zh: "5503 年 夏 41 日", en: "5503 Summer 41" }, remark: { zh: "暂借未经历实战，物归原主。", en: "Borrowed, no combat, returned." } }
        ],
        events: [
          { kind: "Crafted", date: { zh: "5503 年 夏 41 日", en: "5503 Summer 41" }, name: { zh: "制造", en: "Crafted" }, params: { zh: "艾拉", en: "Ella" } }
        ]
      },
      "thing-knife": {
        name: { zh: "短刀", en: "Knife" }, def: "MeleeWeapon_Knife",
        crafter: null, craftedAt: null, kills: 2, holderCount: 1,
        currentHolder: { zh: "仓库", en: "Stockpile" }, currentHolderId: null,
        legacyTitle: { zh: "无名亡刃", en: "The Nameless Edge" },
        legacyNote: { zh: "来历不明，疑为战利品，随汤姆征战至最后一刻。", en: "Origin unknown, likely spoils of war, carried by Tom to his last stand." },
        custody: [
          { gen: 1, kind: "own", who: { zh: "汤姆", en: "Tom" }, id: "pawn-tom", from: { zh: "5502 夏 1", en: "5502 Su1" }, to: { zh: "5503 秋 12", en: "5503 Au12" }, dur: { zh: "直至阵亡", en: "Until death" }, kills: 2, isFirst: true, createdBy: { zh: "未知", en: "Unknown" }, createdAt: { zh: "未知", en: "Unknown" }, remark: { zh: "独任持有，累计双杀后随主阵亡入库存。", en: "Sole owner, two kills, then stored after death." } }
        ],
        events: []
      },
      "thing-solar": {
        name: { zh: "太阳能发电机", en: "Solar generator" }, def: "SolarGenerator",
        crafter: { zh: "马可", en: "Marco" }, crafterId: "pawn-marco",
        craftedAt: { zh: "5503 年 夏 18 日", en: "5503 Summer 18" },
        kills: 0, holderCount: 0, currentHolder: null, currentHolderId: null,
        legacyTitle: { zh: "静默电站", en: "The Silent Station" },
        legacyNote: { zh: "固定设施，无流转。", en: "Static structure, no transfer." },
        custody: [], events: [
          { kind: "Built", date: { zh: "5503 年 夏 18 日", en: "5503 Summer 18" }, name: { zh: "建造", en: "Built" }, params: { zh: "马可", en: "Marco" } }
        ]
      }
    };

    const WEAPON_TABS = ["Legacy"];
    const state = { lang: "zh", view: "overview", weaponId: "thing-rifle", weaponTab: 0, expandLegacy: false };

    function t(k) { return I18N[state.lang][k] ?? k; }
    function L(o) { return o ? (o[state.lang] ?? o.zh ?? o.en ?? o) : ""; }

    // 总览网格（Thing 区块）
    function renderOverview() {
      state.view = "overview";
      document.getElementById("view-overview").style.display = "block";
      document.getElementById("view-weapon").style.display = "none";
      document.getElementById("breadcrumb").textContent = L({ zh: "装备 · 总览", en: "Equipment · Overview" });
      const grid = document.getElementById("thing-grid");
      const order = ["thing-rifle", "thing-knife", "thing-solar"];
      grid.innerHTML = order.map(id => {
        const w = weapons[id];
        let sub = "";
        if (id === "thing-solar") sub = L({ zh: "建造 · 马可", en: "Built · Marco" });
        else {
          const kills = w.custody.reduce((s, c) => s + (c.kills || 0), 0);
          const gens = w.custody.filter(c => c.kind !== "loan").length;
          sub = L({ zh: `传承 ${gens} 代 · 击杀 ${kills}`, en: `Legacy ${gens} gen · Kills ${kills}` });
        }
        return `<div class="obj-card" data-goto="weapon" data-id="${id}">
          <div class="cat">${t("catThing")}</div>
          <div class="name">${L(w.name)}</div>
          <div class="sub">${sub}</div>
        </div>`;
      }).join("");
      bindGoto(grid);
    }

    // 装备详情（传承 Legacy 子容器）
    function renderWeapon() {
      state.view = "weapon";
      document.getElementById("view-overview").style.display = "none";
      document.getElementById("view-weapon").style.display = "block";
      const w = weapons[state.weaponId] || weapons["thing-rifle"];
      document.getElementById("weapon-name").textContent = L(w.name);
      document.getElementById("weapon-meta").textContent = w.def;
      document.getElementById("breadcrumb").textContent = L({ zh: "装备 · ", en: "Equipment · " }) + L(w.name);
      renderTabs("weapon-tabs", WEAPON_TABS, state.weaponTab, i => { state.weaponTab = i; renderWeapon(); });

      // 仅「传承」(Legacy) 一个子容器
      let html = "";
      const createdBy = w.crafter ? L(w.crafter) : t("crafterUnknown");
      const createdAt = w.craftedAt ? L(w.craftedAt) : t("crafterUnknown");
      // 传承代数只计所有权变更（own），借用/转借（loan）不计
      const ownList = (w.custody || []).filter(c => c.kind !== "loan");
      const gens = ownList.length;
      const totalKills = (w.custody || []).reduce((s, c) => s + (c.kills || 0), 0);
      const first = ownList.find(c => c.isFirst) || ownList[0] || null;
      const currentHolder = w.currentHolder ? L(w.currentHolder) : t("crafterUnknown");
      // 传承评价（数据驱动推导）
      let verdict = "";
      if (gens === 0) verdict = L({ zh: "从未易主，静默服役。", en: "Never changed hands; silent service." });
      else if (totalKills >= 3) verdict = L({ zh: "历经战火，功勋卓著，饮血无数。", en: "Blooded and storied; many fell before it." });
      else if (totalKills > 0) verdict = L({ zh: "初历战阵，锋芒已现。", en: "Tasted battle; its edge is known." });
      else if (gens >= 2) verdict = L({ zh: "几经易主，未见血光，静待其主。", en: "Passed hand to hand, yet unblooded, awaiting its master." });
      else verdict = L({ zh: "尚新，传承未远。", en: "Still fresh; its line is young." });

      // ===== 传承称号 =====
      if (w.legacyTitle) html += `<div class="legacy-title">${L(w.legacyTitle)}</div>`;

      // ===== 传承概要（详细 + 创建者/创建时间）=====
      html += `<div class="section-title">${t("legacySummary")}</div>`;
      html += `<div class="stats kpi4">
        <div class="stat-cell"><div class="label">${t("createdBy")}</div><div class="value" style="font-size:14px;margin-top:8px">${createdBy}</div></div>
        <div class="stat-cell"><div class="label">${t("createdAt")}</div><div class="value" style="font-size:12px;margin-top:6px">${createdAt}</div></div>
        <div class="stat-cell"><div class="label">${t("legacyGen")}</div><div class="value">${gens}</div><div class="sub" style="font-size:9px">${t("legacyGenNote")}</div></div>
        <div class="stat-cell"><div class="label">${t("totalKillsN")}</div><div class="value">${totalKills}</div></div>
      </div>`;
      html += `<div class="detail-row"><div class="k">${t("firstHolder")}</div><div class="v">${first ? L(first.who) : "—"}</div></div>`;
      html += `<div class="detail-row"><div class="k">${t("currentHolder")}</div><div class="v">${currentHolder}</div></div>`;
      html += `<div class="verdict">${verdict}</div>`;
      if (w.legacyNote) html += `<div class="blurb"><div class="k">${t("legacyNote")}</div>${L(w.legacyNote)}</div>`;

      // ===== 历届持有者（单一主表，防膨胀：超 5 任默认折叠）=====
      html += `<div class="section-title">${t("legacyChain")}</div>`;
      if (!w.custody.length) html += `<div class="empty">${t("noLegacy")}</div>`;
      else {
        const cap = 5;
        const expanded = !!state.expandLegacy;
        const shown = expanded ? w.custody : w.custody.slice(0, cap);
        html += `<table class="stat"><thead><tr>
          <th>${t("gen")}</th><th>${t("holder")}</th><th>${t("from")}</th><th>${t("to")}</th>
          <th>${t("duration")}</th><th>${t("kills")}</th><th>${t("createdBy")}</th><th>${t("createdAt")}</th><th>${t("remark")}</th>
        </tr></thead><tbody>`;
        shown.forEach(c => {
          const isLoan = c.kind === "loan";
          const isCurrent = w.currentHolderId && c.id === w.currentHolderId;
          const rowCls = isCurrent ? "current" : (c.id ? "clickable" : "");
          const firstBadge = c.isFirst ? ` <span class="chip first">${t("firstHolder")}</span>` : "";
          const loanBadge = isLoan ? ` <span class="chip loan">${t("loan")}</span>` : "";
          const genCell = isLoan ? t("loan") : `${t("gen")}${c.gen != null ? c.gen : ""}${t("th")}`;
          const cb = c.createdBy ? L(c.createdBy) : t("crafterUnknown");
          const ca = c.createdAt ? L(c.createdAt) : t("crafterUnknown");
          html += `<tr class="${rowCls}" ${c.id ? `data-goto="pawn" data-id="${c.id}"` : ""}>
            <td>${genCell}</td>
            <td>${L(c.who)}${firstBadge}${loanBadge}</td>
            <td>${L(c.from)}</td><td>${L(c.to)}</td><td>${L(c.dur)}</td>
            <td><b>${c.kills != null ? c.kills : 0}</b></td>
            <td>${cb}</td><td>${ca}</td>
            <td>${c.remark ? L(c.remark) : "—"}</td>
          </tr>`;
        });
        html += `</tbody></table>`;
        if (ownList.length > cap) {
          const label = expanded ? t("collapse") : t("expandAll").replace("{0}", ownList.length);
          html += `<div class="expand-row"><button type="button" class="expand-btn" data-expand-legacy>${label}</button></div>`;
        }
      }
      const panel = document.getElementById("weapon-panel");
      panel.innerHTML = html;
      bindGoto(panel);
    }

    function renderTabs(elId, keys, selected, onPick) {
      const el = document.getElementById(elId);
      el.innerHTML = keys.map((k, i) =>
        `<button type="button" class="tab ${i === selected ? "active" : ""}" data-i="${i}">${t("tab")[k]}</button>`
      ).join("");
      el.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => onPick(+btn.dataset.i)));
    }

    function bindGoto(root) {
      root.querySelectorAll("[data-goto]").forEach(el => {
        el.addEventListener("click", () => {
          const kind = el.getAttribute("data-goto");
          const id = el.getAttribute("data-id");
          if (kind === "weapon") { state.weaponId = id; state.weaponTab = 0; state.expandLegacy = false; renderWeapon(); }
        });
      });
      root.querySelectorAll("[data-expand-legacy]").forEach(btn => {
        btn.addEventListener("click", () => { state.expandLegacy = !state.expandLegacy; renderWeapon(); });
      });
    }

    // 语言切换
    document.getElementById("btn-zh").addEventListener("click", () => { state.lang = "zh"; syncLang(); });
    document.getElementById("btn-en").addEventListener("click", () => { state.lang = "en"; syncLang(); });
    function syncLang() {
      document.getElementById("btn-zh").classList.toggle("active", state.lang === "zh");
      document.getElementById("btn-en").classList.toggle("active", state.lang === "en");
      document.querySelectorAll('[data-cat="catThing"]').forEach(el => el.textContent = t("catThing"));
      if (state.view === "weapon") renderWeapon(); else renderOverview();
    }

    // 侧边栏导航高亮（仅视觉）
    document.querySelectorAll(".sidebar .side-item[data-filter]").forEach(b =>
      b.addEventListener("click", () => {
        document.querySelectorAll(".sidebar .side-item").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
      }));

    renderOverview();
  </script>
</body>
</html>
