#content{padding:26px 34px 60px}
.x-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0 8px}
.x-stats .kcard b{display:block;font-size:22px;margin-top:3px;font-weight:700}

.x-meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 6px;align-items:center}
.x-meta .chip code{font-family:Consolas,monospace;font-size:12px;color:var(--text)}
.badge.b-hold{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);border:1px solid var(--muted)}
.comp[data-v]{cursor:pointer}
.comp[data-v]:hover .ch b{color:var(--accent)}
.x-na{display:block;font-size:13px;font-weight:400;color:var(--dim);margin-top:5px}
.x-mono{font-family:Consolas,monospace;font-size:11.5px}
.x-foot{margin-top:26px}
.x-en{font-size:12px;color:var(--dim);font-weight:400;margin-left:8px}
/* 语气色（全主题可读） */
:root{--x-good:#4fae67;--x-warn:#cf9a35;--x-bad:#cf5a50}
.tone-good{color:var(--x-good)} .tone-warn{color:var(--x-warn)} .tone-bad{color:var(--x-bad)}
.tone-flat{color:var(--text)}

.x-kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.x-kpi .v{display:block;font-size:20px;font-weight:700;margin-top:4px}

.x-kpi .d.tone-good,.x-kpi .d.tone-warn,.x-kpi .d.tone-bad{font-weight:600}

.x-evt{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--border)}

.x-evt .badge{flex:none;min-width:34px;text-align:center}
.x-evt .tx{font-size:13px;color:var(--text);line-height:1.5}
.x-evt .rt{font-family:Consolas,monospace;font-size:11px;color:var(--accent);min-width:150px;flex:none}

.x-grid{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 4px}

  CENTERS.filter(c=>c.group==='initial').forEach(c=> h += itBtn(c.id, c.name_zh, c.id+' · Tier '+c.tier));
  h += '<div class="grp">预留中心</div><div class="grp-sub">待宝典对齐后启用</div>';
  CENTERS.filter(c=>c.group==='reserved').forEach(c=> h += itBtn(c.id, c.name_zh, c.id+' · Tier '+c.tier));
  navEl.innerHTML = h;
  navEl.querySelectorAll('.it').forEach(b=> b.onclick = ()=> go(b.dataset.v));
}
function itBtn(v, t, s){
  return '<button class="it" data-v="'+v+'" data-k="'+(t+s).toLowerCase()+'"><span class="t">'+t+'</span><span class="s">'+s+'</span></button>';
}
function go(v){ view = v; render(); window.scrollTo(0,0); }

// ===== 组件小件（全部取自宝典类）=====
function badge(status){
  return status.indexOf('预留')===0
    ? '<span class="badge b-hold">'+status+'</span>'
    : '<span class="badge b-ok">'+status+'</span>';
}
function evtBadge(kind){
  const m = {ok:['b-ok','正常'], warn:['b-warn','警告'], bad:['b-no','危急'], info:['b-hold','资讯']};
  const x = m[kind]||m.info;
  return '<span class="badge '+x[0]+'">'+x[1]+'</span>';
}
function tags(arr){ return arr.map(x=>'<span class="tag x-mono">'+x+'</span>').join(''); }
function ksec(t){ return '<div class="ksec"><i></i>'+t+'<u></u></div>'; }
function head(crumb, title, en, api, sub){
  return '<div class="crumb">'+crumb+'</div>'
    + '<div class="dhead"><h2>'+title+'<span class="x-en">'+en+'</span></h2>'
    + '<div class="api">'+api+'</div><div class="intro">'+sub+'</div></div>';
}
function kpiCard(k){
  return '<div class="kcard x-kpi"><span class="tiny">'+k.k+'</span>'
    + '<b class="v tone-'+(k.tone||'flat')+'">'+k.v+'</b>'
    + (k.d ? '<span class="d tone-'+(k.tone||'flat')+'">'+k.d+'</span>' : '')
    + '</div>';
}

// ===== 视图：总览 =====
function vOverview(){
  const init = CENTERS.filter(c=>c.group==='initial');
  const res  = CENTERS.filter(c=>c.group==='reserved');
  let h = head('注册表 / 总览','系统中心总览','System Center Overview',
    'CenterRegistry · '+CENTERS.length+' centers · ScheduleBus v0.1',
    '统一调度层（ScheduleBus）之上的全部控制中枢。点击卡片或侧栏进入中心详情。');
  h += '<h3>殖民地快照</h3><div class="x-stats">'
    + stat('殖民者', GAME.colonists) + stat('平均心情', GAME.mood)
    + stat('威胁等级', '<span class="tone-bad" style="font-size:16px">'+GAME.threat+'</span>')
    + stat('库存总值', GAME.treasury) + '</div>';
  h += '<h3>初始中心</h3><div class="grid">' + init.map(compCard).join('') + '</div>';
  h += '<h3>预留中心</h3><div class="grid">' + res.map(c=>compCard(c,true)).join('') + '</div>';
  h += '<h3>殖民地居民</h3><div class="kcard"><div class="x-roster">'
    + ROSTER.map(r=>'<span class="tag">'+r+'</span>').join('') + '</div></div>';
  h += '<div class="callout x-foot">本页为 RUIF 化预览：组件类与主题令牌取自《终极宝典 v1.0》；殖民者 / 事件 / 数值为随机生成的环世界风味样例（SEED='+SEED_LABEL+'），仅用于 UI 布局打磨。</div>';
  return h;
}
const SEED_LABEL = 20260910;
function stat(k,v){ return '<div class="kcard"><span class="tiny">'+k+'</span><b>'+v+'</b></div>'; }
function compCard(c, reserved){
  const k0 = c.kpi && c.kpi[0];
  return '<div class="comp" data-v="'+c.id+'" data-k="'+(c.name_zh+c.id).toLowerCase()+'">'
    + '<div class="ch"><div><b>'+c.name_zh+'</b><span class="sig">'+c.id+' · Tier '+c.tier+'</span></div>'
    + badge(c.status) + '</div>'
    + '<p class="desc">'+c.responsible.join(' · ')+'</p>'
    + '<div class="demo">'
    + (k0 ? '<span class="tag">'+k0.k+' <b class="tone-'+(k0.tone||'flat')+'">'+k0.v+'</b></span>' : '')
    + tags(c.provides) + ' ' + tags(c.emits)
    + (c.depends_on.length ? '<span class="tag">依赖 '+c.depends_on.map(d=>CENTERS.find(x=>x.id===d).name_zh).join('/')+'</span>' : '')
    + '<span class="tag">事件 '+c.events.length+'</span></div></div>';
}

// ===== 视图：调度总线 =====
function vBus(){
  let h = head('调度域 / 统一调度总线','统一调度总线','ScheduleBus',
    'Clock · EventBus · CommandRouter · StateRegistry · Supervisor',
    '唯一中枢：时间推进、事件分发、指令路由、依赖排序、优先级仲裁、失败隔离。不含任何玩法逻辑。');
  h += '<h3>核心组件</h3><div class="grid">' + BUS.map(b=>
    '<div class="comp"><div class="ch"><div><b>'+b.name+'</b><span class="sig">'+b.sig+'</span></div>'
    + '<span class="badge b-ok">核心</span></div><p class="desc">'+b.desc+'</p></div>').join('') + '</div>';
  h += '<h3>实时事件流（本日样例）</h3><div class="kcard">' + STREAM.map(e=>
    '<div class="x-evt"><span class="t">'+e.t+'</span><span class="rt">'+e.route+'</span>'
    + evtBadge(e.kind) + '<span class="tx">'+e.text+'</span></div>').join('') + '</div>';
  h += '<h3>三层时间模型</h3><table>'
    + '<tr><th>L1 Tick</th><td>最小推进单位（真实粒度由宝典定，本层留接口）</td></tr>'
    + '<tr><th>L2 Phase</th><td>周期内阶段，如 生产 → 结算 → 治理，由调度层编排</td></tr>'
    + '<tr><th>L3 Round</th><td>完整循环，支持中心在 Round 边界启停与快照恢复</td></tr></table>';
  h += '<h3>优先级仲裁</h3><table>'
    + '<tr><th>规则 1</th><td>按 priority_tier 升序（数值小者先）</td></tr>'
    + '<tr><th>规则 2</th><td>同档位按中心自报动态权重降序</td></tr>'
    + '<tr><th>规则 3</th><td>仍冲突进入仲裁队列，下一 tick 补偿</td></tr></table>';
  h += '<h3>失败隔离</h3><table>'
    + '<tr><th>OnTick 抛错</th><td>捕获并记录，该 tick 跳过该中心，不向外传播</td></tr>'
    + '<tr><th>连续失败</th><td>熔断该中心进入降级，只读快照仍可用</td></tr>'
    + '<tr><th>状态写坏</th><td>回滚至上一轮快照</td></tr>'
    + '<tr><th>依赖缺失</th><td>启动期拓扑校验拦截，禁止半启动</td></tr></table>';
  return h;
}

// ===== 视图：中心详情 =====
function vCenter(c){
  let h = '<div class="crumb">注册表 / '+c.name_zh+'</div>'
    + '<div class="dhead"><h2>'+c.name_zh+'<span class="x-en">'+c.name_en+'</span></h2>'
    + '<div class="api">'+c.id+' · Tier '+c.tier+' · version '+c.version+'</div>'
    + '<div class="intro">中心详情 —— 按《标准化规范书》§4 模板渲染，组件取自宝典，数据为环世界风味样例。</div></div>';
  h += '<div class="x-meta"><span class="chip"><code>'+c.id+'</code></span>'
    + '<span class="chip">Tier <b>'+c.tier+'</b></span>'
    + '<span class="chip">版本 <b>'+c.version+'</b></span>' + badge(c.status) + '</div>';

  h += '<h3>KPI 指标</h3><div class="x-kpigrid">' + c.kpi.map(kpiCard).join('') + '</div>';

  h += '<h3>职责边界</h3><div class="x-cols2">';
  h += '<div class="kcard">'+ksec('负责') + c.responsible.map(r=>'<div class="krow"><span>'+r+'</span><span class="tag">own</span></div>').join('') + '</div>';
  h += '<div class="kcard">'+ksec('不负责（委托）')
    + (c.delegated.length ? c.delegated.map(r=>'<div class="krow"><span>'+r+'</span><span class="tag">delegated</span></div>').join('') : '<span class="x-na">暂无</span>')
    + '</div></div>';

  h += '<h3>'+c.table.title+'</h3><table class="x-grid"><tr>'
    + c.table.cols.map(x=>'<th>'+x+'</th>').join('') + '</tr>'
    + c.table.rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('') + '</table>';

  h += '<h3>近期事件流</h3><div class="kcard">' + c.events.map(e=>
    '<div class="x-evt"><span class="t">'+e.t+'</span>'+evtBadge(e.kind)
    + '<span class="tx">'+e.text+'</span></div>').join('') + '</div>';

  h += '<h3>事件契约</h3><table>'
    + '<tr><th>发出 emit</th><td>'+(c.emits.length?tags(c.emits):'<span class="x-na">暂无</span>')+'</td></tr>'
    + '<tr><th>订阅 consume</th><td>'+(c.consumes.length?tags(c.consumes):'<span class="x-na">暂无</span>')+'</td></tr></table>';

  h += '<h3>依赖与能力</h3><table>'
    + '<tr><th>depends_on</th><td>'+(c.depends_on.length?tags(c.depends_on):'<span class="x-na">无（可独立启动）</span>')+'</td></tr>'
    + '<tr><th>provides</th><td>'+(c.provides.length?tags(c.provides):'<span class="x-na">暂无</span>')+'</td></tr>'
    + '<tr><th>调度钩子</th><td>'+(c.hooks.length?tags(c.hooks):'<span class="x-na">暂无</span>')+'</td></tr></table>';

  h += '<div class="callout x-foot">本页数据为随机生成的环世界风味样例（SEED='+SEED_LABEL+'），字段结构对齐《标准化规范书》§4；真实数值待《终局宝典》对齐附录 B 后替换。</div>';
  return h;
}

// ===== 渲染 & 事件 =====
function render(){
  navEl.querySelectorAll('.it').forEach(b=> b.classList.toggle('on', b.dataset.v===view));
  const c = CENTERS.find(x=>x.id===view);
  vroot.innerHTML = view==='overview' ? vOverview()
                  : view==='bus' ? vBus()
                  : c ? vCenter(c) : '';
  vroot.querySelectorAll('.comp[data-v]').forEach(el=> el.onclick = ()=> go(el.dataset.v));
}

// 主题切换（宝典 5 主题，作用于 .v-main 令牌作用域）
document.querySelectorAll('.tbtn').forEach(b=> b.onclick = ()=>{
  document.querySelectorAll('.tbtn').forEach(x=>x.classList.toggle('on', x===b));
  vroot.dataset.theme = b.dataset.t;
});

// 搜索：过滤侧栏 + Enter 跳第一个匹配
const q = document.getElementById('q');
q.oninput = ()=>{
  const k = q.value.trim().toLowerCase();
  navEl.querySelectorAll('.it').forEach(b=>{
    b.style.display = (!k || (b.dataset.k||'').indexOf(k)>=0) ? '' : 'none';
  });
};
q.onkeydown = e=>{
  if(e.key!=='Enter') return;
  const first = navEl.querySelector('.it:not([style*="none"])');
  if(first && q.value.trim()){ go(first.dataset.v); q.value=''; q.oninput(); }
};

renderNav();
render();
</script>
</body>
</html>
